[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#ff4b4b"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1a1d26"
textColor = "#f5f5f5"
borderColor = "rgba(250, 250, 250, 0.16)"
font = "sans-serif"
baseRadius = "0.5rem"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#171923"
secondaryBackgroundColor = "#222533"
textColor = "#f5f5f5"

[theme.light]
primaryColor = "#ff4b4b"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1a1d26"
textColor = "#f5f5f5"
borderColor = "rgba(250, 250, 250, 0.16)"

[theme.light.sidebar]
backgroundColor = "#171923"
secondaryBackgroundColor = "#222533"
textColor = "#f5f5f5"

[theme.dark]
primaryColor = "#ff4b4b"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1a1d26"
textColor = "#f5f5f5"
borderColor = "rgba(250, 250, 250, 0.16)"

[theme.dark.sidebar]
backgroundColor = "#171923"
secondaryBackgroundColor = "#222533"
textColor = "#f5f5f5"
